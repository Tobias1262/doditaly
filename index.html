
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07543c">
  <meta name="description" content="DODITALY FOCACCERIA - Menú digital multilingüe">
  <title>DODITALY FOCACCERIA | Menú QR</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="portada">
    <div class="bandera-italiana" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <p class="bienvenida">BENVENUTI A</p>
    <h1>DODITALY</h1>
    <p class="subtitulo">FOCACCERIA</p>
    <p class="lema">Un angolo d'Italia a Tarragona</p>

    <a class="boton-instagram"
       href="https://www.instagram.com/doditaly_focacceria/"
       target="_blank" rel="noopener noreferrer">
      Instagram
    </a>
  </header>

  <section class="presentacion">
    <img src="images/local.jpg"
         alt="DODITALY FOCACCERIA"
         onerror="this.hidden=true">
    <div class="presentacion-texto">
      <h2>Benvenuti!</h2>
      <p id="frase-portada">Sabores auténticos de Italia</p>
    </div>
  </section>

  <section class="idiomas" aria-label="Seleccionar idioma">
    <h2 id="titulo-idioma">Elegí tu idioma</h2>

    <div class="idiomas-grid">
      <button type="button" data-lang="es">🇪🇸 Español</button>
      <button type="button" data-lang="it">🇮🇹 Italiano</button>
      <button type="button" data-lang="en">🇬🇧 English</button>
      <button type="button" data-lang="fr">🇫🇷 Français</button>
      <button type="button" data-lang="de">🇩🇪 Deutsch</button>
      <button type="button" data-lang="ca">Català</button>
      <button type="button" data-lang="ru">🇷🇺 Русский</button>
      <button type="button" data-lang="pt">🇵🇹 Português</button>
    </div>
  </section>

  <div class="busqueda">
    <label id="titulo-busqueda" for="buscar">¿Qué te apetece hoy?</label>
    <input type="search" id="buscar"
           placeholder="Buscar productos..."
           autocomplete="off">
  </div>

  <nav id="categorias" class="categorias"
       aria-label="Categorías del menú"></nav>

  <main class="contenido">
    <div id="menu"></div>

    <p id="sin-resultados" hidden>
      No encontramos productos.
    </p>

    <section class="aviso">
      <h2 id="titulo-aviso">Información y alérgenos</h2>
      <p id="texto-aviso"></p>
      <p id="texto-gluten"></p>
    </section>
  </main>

  <footer>
    <h2>DODITALY FOCACCERIA</h2>
    <p>Carrer Cos del Bou, 4 · Tarragona</p>
    <p>Grazie e buon appetito!</p>
    <a href="https://www.instagram.com/doditaly_focacceria/"
       target="_blank" rel="noopener noreferrer">
      Instagram
    </a>
  </footer>

  <button id="arriba" type="button"
          aria-label="Volver arriba">↑</button>

</body>
</html>
